# n5: the release. Runs only on a pushed tag `v*`, and fails at once unless that commit is on main; nothing
# here runs on a branch or a pull request.
#
# Every platform is published as mind-<os>-<arch>, with one SHA256SUMS covering every binary, install.sh and the SBOM, and a keyless
# cosign signature of SHA256SUMS made with this workflow's own identity. No secret is used anywhere.
#
# The powerful permissions sit on small jobs: `sign` alone has id-token (and nothing else runs in it but the
# download, the cosign installer, sha256sum and cosign), `publish` alone has contents: write. Everything else reads.
# Nothing is signed or uploaded unless the three gates pass first, and publish refuses a release that already has
# assets (no --clobber: a published release is never overwritten).
#
# macOS is not built here: it would have to be signed and notarized to run on a user's machine, and that needs
# the owner's Apple Developer ID. Until then the release has linux-x64 and linux-arm64 only, and the README says so.
#
# Every action is pinned by commit SHA (the comment is its tag). Newer majors exist; moving to them is a separate task.
# The file naming and the SHA256SUMS are made by scripts/release-assets.sh, which a test runs on a fake dist directory.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: The tag must be a version, by the rule install.sh uses
        run: |
          case "$GITHUB_REF_NAME" in "" | *[!0-9A-Za-z.+-]*) echo "::error::$GITHUB_REF_NAME is not a version tag"; exit 1 ;; esac
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$' || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z[-suffix]"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run coverage
  build:
    needs: gates
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: mkdir -p dist && bun build bin/mind.ts --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig --outfile dist/mind-${{ matrix.platform }}
      - run: ./dist/mind-${{ matrix.platform }} --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mind-${{ matrix.platform }}
          path: dist/mind-${{ matrix.platform }}
          if-no-files-found: error
  sbom:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The source tree only (its lockfile is what lists the dependencies): no node_modules, no built files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: mind-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: mind-sbom.spdx.json
          if-no-files-found: error
  assets:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: cp install.sh dist/install.sh
      - run: sh scripts/release-assets.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
  sign:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # the keyless signature uses the workflow identity, not a secret
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: What is signed is what was listed
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Sign SHA256SUMS (keyless, this workflow's identity)
        working-directory: dist
        run: cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature
          path: |
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          if-no-files-found: error
  publish:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create this tag's one release, and nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: What is uploaded is what was listed
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: One release per tag, never overwritten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          flag=""
          case "$tag" in *-*) flag="--prerelease" ;; esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            n="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            [ "$n" = 0 ] || { echo "::error::$tag already has $n asset(s); a published release is not overwritten"; exit 1; }
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes $flag
          fi
