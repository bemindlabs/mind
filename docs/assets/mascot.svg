<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-labelledby="t d">
  <title id="t">Mind — the Mind mascot</title>
  <desc id="d">A small drop of light, shaded from cyan to indigo, with a face, floating and blinking, with sparks circling it that are joined by thin lines like a small network of thoughts, and a ribbon of light around it.</desc>
  <!--
    Colours are the design tokens (mind-app src/design/tokens.ts, here src/web/tokens/tokens.json), in two artworks.
    The light artwork is the default: its colour is the fallback written in each var(). The dark artwork sets the same
    variables again when the viewer prefers dark (no JavaScript), or when the host forces one with class="light" or
    class="dark" on this root element (the web console follows its own data-theme that way). A variable is written
    here without its two leading hyphens, because a comment may not hold two in a row.
      m-hi      body core, rim, swirl, shine, eye lights   light background      dark foreground
      m-glow    body, first ring                           light info-surface    dark primary
      m-mid     body, middle ring                          light primary         dark brand-2
      m-indigo  body edge, ribbon end, sparks, links       light brand-2         dark brand-2
      m-cyan    halo, ribbon start, sparks, links          light primary         dark primary
      m-ink     eyes and mouth                             light foreground      dark primary-foreground
      m-blush   cheeks                                     light brand-2         dark primary-foreground
      m-ground  the shadow on the ground                   light foreground      dark primary
    The halo stays at 0.12 or less: the design system's limit for a glow where text can sit.
  -->
  <defs>
    <radialGradient id="body" cx="45%" cy="62%" r="62%">
      <stop offset="0" style="stop-color:var(--m-hi,#ffffff)"/>
      <stop offset="0.28" style="stop-color:var(--m-glow,#e5f7fa)"/>
      <stop offset="0.62" style="stop-color:var(--m-mid,#107d93)"/>
      <stop offset="1" style="stop-color:var(--m-indigo,#2331c7)"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" style="stop-color:var(--m-cyan,#107d93)" stop-opacity="0.12"/>
      <stop offset="0.55" style="stop-color:var(--m-cyan,#107d93)" stop-opacity="0.06"/>
      <stop offset="1" style="stop-color:var(--m-cyan,#107d93)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" x2="1">
      <stop offset="0" style="stop-color:var(--m-cyan,#107d93)" stop-opacity="0"/>
      <stop offset="0.3" style="stop-color:var(--m-cyan,#107d93)" stop-opacity="0.9"/>
      <stop offset="0.7" style="stop-color:var(--m-indigo,#2331c7)" stop-opacity="0.9"/>
      <stop offset="1" style="stop-color:var(--m-indigo,#2331c7)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" style="stop-color:var(--m-ground,#121721)" stop-opacity="1"/>
      <stop offset="0.6" style="stop-color:var(--m-ground,#121721)" stop-opacity="0.55"/>
      <stop offset="1" style="stop-color:var(--m-ground,#121721)" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    :root.dark { --m-hi:#f8fafc; --m-glow:#78d1e2; --m-mid:#7e88f1; --m-cyan:#78d1e2; --m-indigo:#7e88f1; --m-ink:#0f1729; --m-ground:#78d1e2; --m-blush:#0f1729; }
    @media (prefers-color-scheme: dark) {
      :root:not(.light) { --m-hi:#f8fafc; --m-glow:#78d1e2; --m-mid:#7e88f1; --m-cyan:#78d1e2; --m-indigo:#7e88f1; --m-ink:#0f1729; --m-ground:#78d1e2; --m-blush:#0f1729; }
    }
    .float  { animation: float 4s ease-in-out infinite; }
    .halo   { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .shadow { opacity: .3; animation: shadow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .eye    { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    .flick  { animation: flick 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    .orbit  { animation: spin 9s linear infinite; transform-origin: 120px 140px; }
    .orbit2 { animation: spin 13s linear infinite reverse; transform-origin: 120px 140px; }
    .ribbon { stroke-dasharray: 70 260; animation: flow 3.2s linear infinite; }
    .spark  { animation: twinkle 2.4s ease-in-out infinite; }
    .spark.b { animation-delay: .8s; }
    .spark.c { animation-delay: 1.6s; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes pulse   { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes shadow  { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(.78); opacity: .2; } }
    @keyframes blink   { 0%,90%,100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } 96% { transform: scaleY(1); } }
    @keyframes flick   { from { transform: rotate(-4deg) scaleY(1); } to { transform: rotate(4deg) scaleY(1.06); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes flow    { to { stroke-dashoffset: -330; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .float, .halo, .shadow, .eye, .flick, .orbit, .orbit2, .ribbon, .spark { animation: none; }
    }
  </style>

  <!-- the shadow on the ground, smaller when Mind floats up -->
  <ellipse class="shadow" cx="120" cy="238" rx="42" ry="7" fill="url(#ground)"/>

  <g class="float">
    <!-- glow -->
    <circle class="halo" cx="120" cy="140" r="96" fill="url(#halo)"/>

    <!-- sparks circling -->
    <g class="orbit">
      <!-- thin links between the sparks: a small network of thoughts -->
      <polygon points="120,52 206,150 52,186" fill="none" style="stroke:var(--m-indigo,#2331c7)" stroke-opacity=".3" stroke-width="1" stroke-linejoin="round"/>
      <circle class="spark" cx="120" cy="52" r="3.2" style="fill:var(--m-cyan,#107d93)"/>
      <circle class="spark b" cx="206" cy="150" r="2.4" style="fill:var(--m-indigo,#2331c7)"/>
      <circle class="spark c" cx="52" cy="186" r="2.8" style="fill:var(--m-cyan,#107d93)"/>
    </g>
    <g class="orbit2">
      <line x1="190" y1="80" x2="44" y2="110" style="stroke:var(--m-cyan,#107d93)" stroke-opacity=".25" stroke-width="1"/>
      <circle class="spark b" cx="190" cy="80" r="2" style="fill:var(--m-indigo,#2331c7)"/>
      <circle class="spark" cx="44" cy="110" r="2.2" style="fill:var(--m-cyan,#107d93)"/>
    </g>

    <!-- ribbon of light behind -->
    <ellipse cx="120" cy="150" rx="78" ry="22" fill="none" stroke="url(#ribbon)" stroke-width="3" transform="rotate(-14 120 150)" opacity=".55"/>

    <!-- body: a drop of light, its tip a small flame -->
    <g class="flick">
      <path d="M120 36 C131 66 174 98 174 146 A54 54 0 0 1 66 146 C66 98 109 66 120 36 Z" fill="url(#body)"/>
      <path d="M120 36 C131 66 174 98 174 146 A54 54 0 0 1 66 146 C66 98 109 66 120 36 Z" fill="none" style="stroke:var(--m-hi,#ffffff)" stroke-opacity=".55" stroke-width="1.5"/>
      <!-- inner swirl, like the logo -->
      <path d="M92 168 C110 186 150 180 156 150 C160 130 140 116 124 124" fill="none" style="stroke:var(--m-hi,#ffffff)" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
      <!-- shine -->
      <ellipse cx="96" cy="118" rx="9" ry="16" style="fill:var(--m-hi,#ffffff)" opacity=".7" transform="rotate(24 96 118)"/>
    </g>

    <!-- face -->
    <g>
      <ellipse class="eye" cx="104" cy="146" rx="6" ry="8.5" style="fill:var(--m-ink,#121721)"/>
      <ellipse class="eye" cx="136" cy="146" rx="6" ry="8.5" style="fill:var(--m-ink,#121721)"/>
      <circle cx="106.2" cy="142.5" r="2" style="fill:var(--m-hi,#ffffff)"/>
      <circle cx="138.2" cy="142.5" r="2" style="fill:var(--m-hi,#ffffff)"/>
      <ellipse cx="92" cy="162" rx="7" ry="4" style="fill:var(--m-blush,#2331c7)" opacity=".3"/>
      <ellipse cx="148" cy="162" rx="7" ry="4" style="fill:var(--m-blush,#2331c7)" opacity=".3"/>
      <path d="M112 164 Q120 172 128 164" fill="none" style="stroke:var(--m-ink,#121721)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ribbon of light in front -->
    <ellipse class="ribbon" cx="120" cy="150" rx="78" ry="22" fill="none" stroke="url(#ribbon)" stroke-width="3" stroke-linecap="round" transform="rotate(-14 120 150)"/>
  </g>
</svg>
